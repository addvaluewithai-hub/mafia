name: Game QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13'
      - name: Install dependencies from lockfile
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Expo doctor
        run: npx expo-doctor
      - name: Vote UI authoritative contract
        run: node scripts/qa/vote-ui-contract.mjs
      - name: Gender UI RPC contract
        run: node scripts/qa/gender-ui-contract.mjs
      - name: Standalone join gender contract
        run: node scripts/qa/standalone-join-gender-contract.mjs
      - name: Player card identity contract
        run: node scripts/qa/player-card-identity-contract.mjs
      - name: AI discussion cue contract
        run: node --experimental-strip-types scripts/qa/ai-discussion-contract.mjs
      - name: Legacy identity compatibility contract
        run: node scripts/qa/legacy-identity-contract.mjs
      - name: Generated case role identity contract
        run: node scripts/qa/generated-case-role-contract.mjs
      - name: Curated player-count contract
        run: node scripts/qa/curated-player-count-contract.mjs
      - name: Full-game state simulations
        run: node scripts/qa/game-state-sim.mjs
      - name: Story critic (report mode)
        run: node scripts/qa/story-critic.mjs
      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0
      - name: Start clean local Supabase
        run: supabase start
      - name: Install browser QA runtime
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Solo AI browser E2E
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          export EXPO_PUBLIC_SUPABASE_URL="$API_URL"
          export EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export BASE_URL="http://127.0.0.1:8081"
          npx expo export --platform web > /tmp/akher-kheit-expo-web.log 2>&1
          CI=1 npx expo serve --port 8081 >> /tmp/akher-kheit-expo-web.log 2>&1 &
          EXPO_PID=$!
          trap 'kill "$EXPO_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --max-time 3 --fail --silent "$BASE_URL/solo" > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/akher-kheit-expo-web.log
              exit 1
            fi
            sleep 2
          done
          timeout 90s npx playwright test scripts/qa/solo-browser-e2e.spec.mjs --reporter=line
      - name: Multi-client human browser E2E
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          export EXPO_PUBLIC_SUPABASE_URL="$API_URL"
          export EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export BASE_URL="http://127.0.0.1:8081"
          npx expo export --platform web > /tmp/akher-kheit-human-web.log 2>&1
          CI=1 npx expo serve --port 8081 >> /tmp/akher-kheit-human-web.log 2>&1 &
          EXPO_PID=$!
          trap 'kill "$EXPO_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --max-time 3 --fail --silent "$BASE_URL/create" > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/akher-kheit-human-web.log
              exit 1
            fi
            sleep 2
          done
          timeout 120s npx playwright test scripts/qa/human-multiclient-browser-e2e.spec.mjs --reporter=line
      - name: Player identity schema contract
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}"
          node scripts/qa/player-identity-schema-e2e.mjs
      - name: Player gender RPC contract
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}"
          node scripts/qa/player-gender-rpc-e2e.mjs
      - name: Case role install contract
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}"
          node scripts/qa/case-role-install-e2e.mjs
      - name: Gender-aware case wording install contract
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}"
          node scripts/qa/gender-case-text-install-e2e.mjs
      - name: AI case generation abuse guard
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}"
          node scripts/qa/case-generation-rate-limit-e2e.mjs
      - name: Room creation and join abuse guard
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}"
          node scripts/qa/room-join-rate-limit-e2e.mjs
      - name: Anonymous identity churn perimeter
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}"
          node scripts/qa/public-abuse-perimeter-e2e.mjs
      - name: AI players solo-play E2E
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}"
          node scripts/qa/ai-players-e2e.mjs
      - name: Full-game RPC E2E (4–10 players)
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}"
          node scripts/qa/supabase-e2e.mjs
      - name: Eliminated Boss retains admin controls
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}"
          node scripts/qa/boss-eliminated-e2e.mjs
      - name: Same-room rematch E2E
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}"
          node scripts/qa/rematch-e2e.mjs
      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: game-qa-reports
          path: qa/reports/*.json
          if-no-files-found: warn
          retention-days: 14
