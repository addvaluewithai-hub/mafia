name: Vercel Release Package

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character main commit SHA to package after green CI/Game QA
        required: true
        type: string

permissions:
  contents: read
  checks: read

jobs:
  preflight-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release SHA
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "release_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Read-only production release preflight
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
        run: node scripts/release/preflight.mjs

      - name: Release metadata
        id: meta
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          echo "short_sha=${RELEASE_SHA:0:12}" >> "$GITHUB_OUTPUT"
          printf 'repository=%s\nrelease_sha=%s\npreflight=passed\n' \
            "$GITHUB_REPOSITORY" "$RELEASE_SHA" > release-manifest.txt

      - name: Pack exact release source
        run: |
          zip -r vercel-source.zip . \
            -x '.git/*' 'node_modules/*' 'dist/*' 'vercel-source.zip'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-source-${{ steps.meta.outputs.short_sha }}
          path: vercel-source.zip
          retention-days: 7
