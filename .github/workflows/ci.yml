name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - name: Install dependencies
        run: npm install
      - name: Expo doctor
        run: npx expo-doctor
      - name: TypeScript
        run: npm run typecheck
