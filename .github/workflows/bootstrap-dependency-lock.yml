name: Bootstrap dependency lock

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-dependency-lock.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13
      - name: Generate npm lockfile with npm
        run: npm install --package-lock-only --ignore-scripts
      - name: Capture npm audit evidence
        shell: bash
        run: |
          mkdir -p qa/reports
          npm audit --json > /tmp/npm-audit.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          const vulnerabilities = Object.entries(audit.vulnerabilities ?? {}).map(([name, value]) => ({
            name,
            severity: value.severity,
            isDirect: value.isDirect,
            range: value.range,
            fixAvailable: value.fixAvailable,
            via: (value.via ?? []).map((item) => typeof item === 'string' ? item : ({
              source: item.source,
              name: item.name,
              dependency: item.dependency,
              title: item.title,
              severity: item.severity,
              range: item.range,
              url: item.url,
            })),
          }));
          const report = {
            generatedAt: new Date().toISOString(),
            npmVersion: process.env.npm_config_user_agent ?? null,
            metadata: audit.metadata ?? null,
            vulnerabilities,
          };
          fs.writeFileSync('qa/reports/npm-audit-baseline.json', `${JSON.stringify(report, null, 2)}\n`);
          NODE
      - name: Commit generated dependency evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json qa/reports/npm-audit-baseline.json
          git diff --cached --exit-code && exit 1 || true
          git commit -m "chore: commit npm lockfile and audit baseline"
          git push origin HEAD:main
